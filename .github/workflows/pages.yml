name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Require GitHub Actions as Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pagesの公開元がGitHub Actionsではありません（build_type=${build_type}）。リポジトリ Settings → Pages → Build and deployment で Source を GitHub Actions に変更してください。mainブランチ公開のままだと index.html を置かない運用でルートが404になります。"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: texconf/2026
          path: 2026

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: 2026/package-lock.json

      - name: Build hub index from 2026
        working-directory: 2026
        env:
          TEXCONF_HUB_ROOT: ${{ github.workspace }}
        run: |
          npm ci
          npm run build:hub

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir site
          cp index.html index.src.html style.css favicon.svg .nojekyll README.md site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
