name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: texconf/2026
          path: 2026

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: 2026/package-lock.json

      - name: Build hub index from 2026
        working-directory: 2026
        env:
          TEXCONF_HUB_ROOT: ${{ github.workspace }}
        run: |
          npm ci
          npm run build:hub

      - name: Prepare site
        run: |
          mkdir site
          cp index.html index.src.html style.css favicon.svg .nojekyll README.md site/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
